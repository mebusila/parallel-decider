[project]
name = "parallel-decider"
version = "0.0.1"
description = "Local parallel decision experiments for AI agent routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "sentence-transformers>=3.0",
    "tqdm>=4.66",
]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project.scripts]
parallel-decider = "parallel_decider.cli:main"